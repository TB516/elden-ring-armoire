services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    command: sleep infinity
    volumes:
      - ..:/workspace:cached
      - node-modules:/workspace/node_modules
      - pnpm-store:/home/node/.local/share/pnpm/store
    environment:
      DATABASE_URL: postgresql://armoire:armoire@db:5432/armoire
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: outfit-images
      S3_ACCESS_KEY_ID: armoire-dev
      S3_SECRET_ACCESS_KEY: armoire-local-development-only
      S3_FORCE_PATH_STYLE: "true"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18
    environment:
      POSTGRES_USER: armoire
      POSTGRES_PASSWORD: armoire
      POSTGRES_DB: armoire
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U armoire -d armoire"]
      interval: 2s
      timeout: 5s
      retries: 30

  rustfs:
    image: rustfs/rustfs:1.0.0
    # Share localhost with the app so signed URLs work through forwarded or published ports.
    network_mode: service:app
    environment:
      # Local development credentials only.
      RUSTFS_ACCESS_KEY: armoire-dev
      RUSTFS_SECRET_KEY: armoire-local-development-only
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOG_DIRECTORY: ""
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9000/health"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

  storage-init:
    image: rustfs/rc:v0.1.36
    network_mode: service:app
    depends_on:
      rustfs:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        rc alias set local http://localhost:9000 armoire-dev armoire-local-development-only --region us-east-1 --bucket-lookup path
        rc bucket create local/outfit-images --ignore-existing

volumes:
  node-modules:
  pnpm-store:
  postgres-data:
  rustfs-data:
